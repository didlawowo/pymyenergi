name: Temporary CI bootstrap

on:
  push:
    branches: [ci/shared-workflow-v1.18.3]

permissions:
  contents: read

jobs:
  format:
    if: github.repository == 'didlawowo/pymyenergi' && github.actor == 'didlawowo'
    runs-on: arc-runner-pymyenergi
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.format.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply exact type migration, then verify formatter AST equivalence
        id: format
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 python ci_bootstrap_typing.py
          uv run --no-project --python 3.12 python - <<'PY'
          import ast
          import json
          import os
          import pathlib
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          original = git("rev-parse", "HEAD")
          tracked = git("ls-files", "-z").split("\0")
          python_files = [pathlib.Path(p) for p in tracked if p.endswith(".py")]
          before = {
              str(p): ast.dump(ast.parse(p.read_text()), include_attributes=False)
              for p in python_files
          }
          subprocess.run(["uvx", "--from", "ruff==0.16.8", "ruff", "format", "."], check=True)
          for p in python_files:
              after = ast.dump(ast.parse(p.read_text()), include_attributes=False)
              if before[str(p)] != after:
                  raise SystemExit(f"Refusing a semantic formatter change in {p}")
          changed = [p for p in git("diff", "--name-only", "-z").split("\0") if p]
          if any(p not in before and p != "README.md" for p in changed):
              raise SystemExit(f"Unexpected changes: {changed}")
          if changed:
              subprocess.run(["git", "add", "--", *changed], check=True)
              subprocess.run(["git", "-c", "user.name=github-actions[bot]", "-c",
                              "user.email=41898282+github-actions[bot]@users.noreply.github.com",
                              "commit", "-m", "fix: resolve CI type diagnostics without device command changes"], check=True)
              # A concurrent update makes this ordinary push fail; no force.
              subprocess.run(["git", "push", "origin", "HEAD:refs/heads/ci/shared-workflow-v1.18.3"], check=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha={git('rev-parse', 'HEAD')}\n")
          print(json.dumps({"base": original, "head": git("rev-parse", "HEAD"), "changed": changed}))
          PY

  diagnostics:
    needs: format
    runs-on: arc-runner-pymyenergi
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.format.outputs.sha }}
          persist-credentials: false
      - uses: didlawowo/workflow-ci/.github/actions/setup-python-env@v1.18.3
        with:
          python-version: "3.12"
      - name: Validate type corrections
        run: uv run mypy --no-incremental pymyenergi
      - name: Run full offline tests
        run: uv run pytest tests -q --timeout=9
      - uses: didlawowo/workflow-ci/.github/actions/precommit-contract@v1.18.3
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ci-bootstrap-lock
          path: uv.lock
          retention-days: 1
