name: Prepare and verify low-risk quality patch
on:
  push:
    branches: [prepare/quality-20261014]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'didlawowo/pymyenergi' && github.actor == 'didlawowo'
    runs-on: arc-runner-pymyenergi
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: didlawowo/workflow-ci/.github/actions/setup-python-env@v1.18.3
        with:
          python-version: "3.12"
      - name: Verify new tests detect the original defects
        shell: bash
        run: |
          set +e
          uv run --no-sync pytest tests/test_low_risk_quality.py -q --timeout=9 --junitxml=/tmp/quality-before.xml
          rc=$?
          set -e
          test "$rc" = 1
      - name: Apply bounded reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/apply-quality.py" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          edits = {
              "pymyenergi/zappi.py": [
                  ('        self._data["num_phases"] = PHASES_STRINGS.get(phase)',
                   '        self._data["phaseSetting"] = PHASES_STRINGS[phase]'),
                  ('        phasesetting_int = PHASE_SETTING.get(phase)',
                   '        if not isinstance(phase, str) or phase not in PHASE_SETTING:\n'
                   '            raise ValueError("Phase must be one of: 1, 3, auto")\n'
                   '        phasesetting_int = PHASE_SETTING[phase]'),
                  ('        await self._connection.get(f"/cgi-zappi-mode-Z{self._serialno}-4-0-0-0000")\n        return True',
                   '        await self._connection.get(f"/cgi-zappi-mode-Z{self._serialno}-4-0-0-0000")\n'
                   '        self._data["zmo"] = 4\n        return True'),
              ],
              "pymyenergi/connection.py": [
                  ('                except Exception:\n'
                   '                    _LOGGER.error("Myenergi server request problem")\n'
                   '                    _LOGGER.debug(sys.exc_info()[0])',
                   '                except httpx.TimeoutException as exc:\n'
                   '                    raise TimeoutException() from exc\n'
                   '                except Exception:\n'
                   '                    _LOGGER.error("Myenergi server request problem")\n'
                   '                    _LOGGER.debug(sys.exc_info()[0])\n'
                   '                    raise'),
                  ('                    self.do_query_asn = False\n'
                   '                    self._checkMyenergiServerURL(response.headers)',
                   '                    self._checkMyenergiServerURL(response.headers)\n'
                   '                    self.do_query_asn = False'),
              ],
          }
          for relative, replacements in edits.items():
              path = root / relative
              text = path.read_text()
              for before, after in replacements:
                  if text.count(before) != 1:
                      raise SystemExit(f"Refusing ambiguous edit: {relative}: {before!r}")
                  text = text.replace(before, after, 1)
              path.write_text(text)
          PY
          python3 "$RUNNER_TEMP/apply-quality.py" "$GITHUB_WORKSPACE"
          uv run ruff format tests/test_low_risk_quality.py
      - name: Run full offline suite and static checks
        run: |
          uv run --no-sync pytest tests -q --timeout=9 --cov=pymyenergi --cov-fail-under=30 --cov-report=xml:/tmp/quality-coverage.xml --junitxml=/tmp/quality-after.xml
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy --no-incremental pymyenergi
          uv run python -m build
          uv run twine check --strict dist/*
      - name: Build and test portable upstream worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/pymyenergi-upstream" 90fc44e58f6e47b2f17542f1075d6efdb9c81d38
          python3 "$RUNNER_TEMP/apply-quality.py" "$RUNNER_TEMP/pymyenergi-upstream"
          cp tests/test_low_risk_quality.py "$RUNNER_TEMP/pymyenergi-upstream/tests/"
          cd "$RUNNER_TEMP/pymyenergi-upstream"
          PYTHONPATH="$PWD" "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest tests -q --asyncio-mode=auto --disable-socket --allow-unix-socket --timeout=9 --junitxml=/tmp/quality-upstream.xml
      - name: Publish only tested source changes to review branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --mixed ec8d24bdca3b34c60648e91e0870c1bd4bd5c9f3
          rm .github/workflows/prepare-quality-once.yml
          git add pymyenergi/zappi.py pymyenergi/connection.py tests/test_low_risk_quality.py
          git commit -m 'fix: preserve Zappi command state and discovery error causes'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/quality/low-risk-library
          echo "FORK_SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          cd "$RUNNER_TEMP/pymyenergi-upstream"
          git add pymyenergi/zappi.py pymyenergi/connection.py tests/test_low_risk_quality.py
          git commit -m 'fix: preserve Zappi command state and discovery error causes'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/upstream/low-risk-quality
          echo "UPSTREAM_SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: low-risk-quality-evidence
          path: /tmp/quality-*.xml
          retention-days: 7
