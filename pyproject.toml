[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymyenergi"
dynamic = ["version"]
description = "Python library and CLI for communicating with myenergi API."
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
authors = [{name = "Johan Isaksson", email = "johan@generatorhallen.se"}]
dependencies = ["httpx", "pycognito"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/cjne/pymyenergi"

[project.scripts]
myenergi = "pymyenergi.cli:cli"

[tool.setuptools]
packages = ["pymyenergi"]
include-package-data = true

[tool.setuptools.package-data]
pymyenergi = ["VERSION"]

[tool.setuptools.dynamic]
version = {file = "pymyenergi/VERSION"}

[dependency-groups]
dev = [
    "build",
    "mypy",
    "pre-commit>=4.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6",
    "pytest-httpx",
    "pytest-socket",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3",
    "ruff==0.16.8",
    "twine",
    "yamllint",
]

# Developer tooling is separate from the library's published Python requirement.
[tool.uv.dependency-groups]
dev = {requires-python = ">=3.12"}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["pymyenergi"]
ignore_missing_imports = true
implicit_optional = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["pymyenergi"]

[tool.coverage.report]
show_missing = true
